<!-- Chatbot Widget - Add this to your website -->
<div class="chatbot-container">
    <!-- Chat Window -->
    <div class="chat-window" id="chatWindow">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="chat-avatar">👋</div>
            <div class="chat-info">
                <h3>Carevio</h3>
                <p>AI Assistant</p>
            </div>
            <div class="online-status"></div>
        </div>
        
        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot welcome-message">
                <div class="message-content">
                    Hi there! 👋 I'm Carevio, your AI assistant. How can I help you today?
                </div>
            </div>
        </div>
        
        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <!-- Chat Input -->
        <div class="chat-input-container">
            <textarea 
                class="chat-input" 
                id="chatInput" 
                placeholder="Type your message..."
                rows="1"
                maxlength="500"
            ></textarea>
            <button class="send-button" id="sendButton">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22,2 15,22 11,13 2,9"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Chat Toggle Button -->
    <button class="chat-toggle" id="chatToggle">
        <div class="notification-badge" id="notificationBadge">1</div>
        <svg class="chat-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg class="close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
</div>

<style>
/* Chatbot Styles */
.chatbot-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Chat toggle button */
.chat-toggle {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #4dd0e1 0%, #00bcd4 100%);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(77, 208, 225, 0.4);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.chat-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(77, 208, 225, 0.5);
}

.chat-toggle svg {
    width: 24px;
    height: 24px;
    color: white;
    transition: transform 0.3s ease;
}

.chat-toggle.open svg.chat-icon {
    transform: rotate(180deg) scale(0);
}

.chat-toggle.open svg.close-icon {
    transform: rotate(0deg) scale(1);
}

.chat-toggle svg.close-icon {
    position: absolute;
    transform: rotate(-180deg) scale(0);
}

/* Notification badge */
.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4757;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* Chat window */
.chat-window {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    transform: scale(0) translateY(20px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    transform-origin: bottom right;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.chat-window.open {
    transform: scale(1) translateY(0);
    opacity: 1;
}

/* Chat header */
.chat-header {
    background: linear-gradient(135deg, #4dd0e1 0%, #00bcd4 100%);
    color: white;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-avatar {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.chat-info h3 {
    font-size: 16px;
    margin-bottom: 2px;
    margin: 0;
}

.chat-info p {
    font-size: 12px;
    opacity: 0.9;
    margin: 0;
}

.online-status {
    width: 8px;
    height: 8px;
    background: #2ed573;
    border-radius: 50%;
    margin-left: auto;
    animation: blink 2s infinite;
}

@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
}

/* Chat messages */
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f8f9fa;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    display: flex;
    align-items: flex-start;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    justify-content: flex-end;
}

.message.bot {
    justify-content: flex-start;
}

.message-content {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
}

.message.user .message-content {
    background: linear-gradient(135deg, #4dd0e1 0%, #00bcd4 100%);
    color: white;
    border-bottom-right-radius: 6px;
}

.message.bot .message-content {
    background: white;
    color: #333;
    border: 1px solid #e1e5e9;
    border-bottom-left-radius: 6px;
}

/* Typing indicator */
.typing-indicator {
    display: none;
    padding: 12px 16px;
    background: white;
    border-radius: 18px;
    border-bottom-left-radius: 6px;
    max-width: 75%;
    border: 1px solid #e1e5e9;
}

.typing-indicator.show {
    display: block;
    animation: slideIn 0.3s ease;
}

.typing-dots {
    display: flex;
    gap: 4px;
    align-items: center;
}

.typing-dots span {
    width: 8px;
    height: 8px;
    background: #ccc;
    border-radius: 50%;
    animation: typingDots 1.4s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-dots span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes typingDots {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
    }
    30% {
        transform: translateY(-10px);
        opacity: 1;
    }
}

/* Chat input */
.chat-input-container {
    padding: 20px;
    background: white;
    border-top: 1px solid #e1e5e9;
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.chat-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #e1e5e9;
    border-radius: 25px;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 100px;
    min-height: 44px;
    transition: border-color 0.3s ease;
    font-family: inherit;
}

.chat-input:focus {
    border-color: #4dd0e1;
}

.send-button {
    background: linear-gradient(135deg, #4dd0e1 0%, #00bcd4 100%);
    color: white;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.send-button:hover:not(:disabled) {
    transform: scale(1.1);
}

.send-button:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
}

/* Error message */
.error-message {
    background: #ffebee;
    color: #c62828;
    padding: 12px 16px;
    border-radius: 18px;
    border-bottom-left-radius: 6px;
    font-size: 13px;
    max-width: 75%;
    border: 1px solid #ffcdd2;
    animation: slideIn 0.3s ease;
}

/* Scrollbar styling */
.chat-messages::-webkit-scrollbar {
    width: 4px;
}

.chat-messages::-webkit-scrollbar-track {
    background: transparent;
}

.chat-messages::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.1);
    border-radius: 2px;
}

/* Mobile responsiveness */
@media (max-width: 480px) {
    .chatbot-container {
        bottom: 10px;
        right: 10px;
    }

    .chat-window {
        width: calc(100vw - 20px);
        height: calc(100vh - 100px);
        right: -10px;
        bottom: 70px;
    }
}

/* Welcome animation */
.welcome-message {
    animation: bounce 2s ease-in-out 1s both;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
    }
    40% {
        transform: translateY(-5px);
    }
    60% {
        transform: translateY(-3px);
    }
}
</style>

<script>
class WebsiteChatbot {
    constructor() {
        this.webhookUrl = 'https://stagingweb.myonsitehealthcare.com/n8n-proxy.php';
        this.sessionId = this.generateSessionId();
        this.isOpen = false;
        
        // DOM elements
        this.chatToggle = document.getElementById('chatToggle');
        this.chatWindow = document.getElementById('chatWindow');
        this.chatMessages = document.getElementById('chatMessages');
        this.chatInput = document.getElementById('chatInput');
        this.sendButton = document.getElementById('sendButton');
        this.typingIndicator = document.getElementById('typingIndicator');
        this.notificationBadge = document.getElementById('notificationBadge');
        
        this.init();
    }
    
    init() {
        // Chat toggle functionality
        this.chatToggle.addEventListener('click', () => this.toggleChat());
        
        // Send message functionality
        this.sendButton.addEventListener('click', () => this.sendMessage());
        this.chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.sendMessage();
            }
        });
        
        // Auto-resize textarea
        this.chatInput.addEventListener('input', () => {
            this.autoResizeTextarea();
            this.sendButton.disabled = !this.chatInput.value.trim();
        });
        
        // Initial button state
        this.sendButton.disabled = true;
        
        // Hide notification badge initially
        setTimeout(() => {
            this.hideNotificationBadge();
        }, 3000);
    }
    
    generateSessionId() {
        return 'chat_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    }
    
    toggleChat() {
        this.isOpen = !this.isOpen;
        this.chatToggle.classList.toggle('open', this.isOpen);
        this.chatWindow.classList.toggle('open', this.isOpen);
        
        if (this.isOpen) {
            this.hideNotificationBadge();
            // Focus input when opened
            setTimeout(() => {
                this.chatInput.focus();
            }, 300);
        }
    }
    
    hideNotificationBadge() {
        this.notificationBadge.style.display = 'none';
    }
    
    showNotificationBadge() {
        this.notificationBadge.style.display = 'flex';
    }
    
    autoResizeTextarea() {
        this.chatInput.style.height = '44px';
        this.chatInput.style.height = Math.min(this.chatInput.scrollHeight, 100) + 'px';
    }
    
    addMessage(content, sender = 'bot') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        
        if (sender === 'bot' && (content.includes('Error') || content.includes('Sorry'))) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = content;
            this.chatMessages.appendChild(errorDiv);
        } else {
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = content;
            messageDiv.appendChild(messageContent);
            this.chatMessages.appendChild(messageDiv);
        }
        
        this.scrollToBottom();
        
        // Show notification if chat is closed and it's a bot message
        if (!this.isOpen && sender === 'bot') {
            this.showNotificationBadge();
        }
    }
    
    showTypingIndicator() {
        this.typingIndicator.classList.add('show');
        this.scrollToBottom();
    }
    
    hideTypingIndicator() {
        this.typingIndicator.classList.remove('show');
    }
    
    scrollToBottom() {
        setTimeout(() => {
            this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
        }, 100);
    }
    
    async sendMessage() {
        const message = this.chatInput.value.trim();
        if (!message) return;
        
        // Add user message to chat
        this.addMessage(message, 'user');
        
        // Clear input and reset height
        this.chatInput.value = '';
        this.chatInput.style.height = '44px';
        this.sendButton.disabled = true;
        
        // Show typing indicator
        this.showTypingIndicator();
        
        try {
            const response = await fetch(this.webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                mode: 'cors',
                credentials: 'omit',
                body: JSON.stringify({
                    chatInput: message,
                    sessionId: this.sessionId,
                    action: 'sendMessage'
                })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            
            // Hide typing indicator
            this.hideTypingIndicator();
            
            // Handle the response
            if (data.output) {
                this.addMessage(data.output, 'bot');
            } else if (data.message) {
                this.addMessage(data.message, 'bot');
            } else {
                this.addMessage('I received your message, but I\'m not sure how to respond right now.', 'bot');
            }
            
        } catch (error) {
            console.error('Error sending message:', error);
            this.hideTypingIndicator();
            this.addMessage('Sorry, I\'m having trouble connecting right now. Please try again.', 'bot');
        }
    }
}

// Initialize the chatbot when the page loads
document.addEventListener('DOMContentLoaded', () => {
    new WebsiteChatbot();
});
</script>
